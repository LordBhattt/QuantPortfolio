services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: quantportfolio
      POSTGRES_USER: quantportfolio
      POSTGRES_PASSWORD: quantportfolio
    ports:
      - "5432:5432"
    volumes:
      - quantportfolio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantportfolio -d quantportfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./.env
    environment:
      ALLOWED_ORIGINS: '["http://localhost:8081","http://127.0.0.1:8081"]'
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  quantportfolio-db:
